jobs: 500
printshellcmds: True 
conda-frontend: mamba
use-conda: True
executor: slurm

restart-times: 3

# Default resources
default-resources:
  mem_mb: 8000
  retries: 3
  threads: 1
  slurm_partition: batch-mc2

# Rule specific resources
set-mem_mb:
  divide_by_chrom: 6000
  import_geno_into_r_bychr: 8000
  collect_prscs: 4000
  predict_lassosum2: 4000
  predict_LDpred2: 4000
  predict_CT: 4000
  prs_CT: 16000

set-threads:
  import_geno_into_r_bychr: 8
  compute_distance: 8
  prs_LDpred2: 12
  prs_lassosum2: 8
  run_prscs: 8
  prs_CT: 8

